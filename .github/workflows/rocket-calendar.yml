name: generate-rocket-calendar

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 6am UTC — adjust as you like
  workflow_dispatch:       # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate rocket calendar SVG
        env:
          GH_USERNAME: SrijanCherupally
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/generate-rocket-svg.mjs assets/rocket-calendar.svg

      - name: Push to output branch
        run: |
          cp assets/rocket-calendar.svg /tmp/rocket-calendar.svg
          cp assets/rocket-v2.png /tmp/rocket-v2.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p assets
          cp /tmp/rocket-calendar.svg assets/rocket-calendar.svg
          cp /tmp/rocket-v2.png assets/rocket-v2.png
          git add assets/rocket-calendar.svg assets/rocket-v2.png
          git commit -m "chore: update rocket calendar" --allow-empty
          git push -f origin output
